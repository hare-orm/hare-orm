[package]
name = "hare-native"
version = "0.1.0"
edition = "2021"

[lib]
name = "native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["chrono"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time", "io-util"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1"] }
# array_to_sql/array_from_sql, which postgres-types uses internally but does not re-export.
postgres-protocol = "0.6"
fallible-iterator = "0.2"
deadpool-postgres = "0.14"
# The pool deadpool-postgres builds on - its `Manager` trait, which `TimedManager` implements to
# time every connect. The version deadpool-postgres uses.
deadpool = { version = "0.13", default-features = false, features = ["managed", "rt_tokio_1"] }
# Pure-Rust TLS: no system OpenSSL.
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
thiserror = "2"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
uuid = "1"
chrono = "0.4"
# Shortest round-tripping float digits - the ones orjson writes.
ryu = "1"
# Integer text without the formatting machinery.
itoa = "1"
# JSON numbers kept as their text - compared as exact decimals.
serde_json = { version = "1", features = ["arbitrary_precision"] }
# The MD5 and SHA digests of the text functions.
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
# The allocator of every Rust allocation in the extension - a decoded row allocates several times,
# and the system allocator (HeapAlloc on Windows) costs several times more per allocation.
mimalloc = { version = "0.1", default-features = false }

[features]
# Off for `cargo test`, which links libpython into the test binary.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# PyO3 entry points take many plan arguments and return PyResult by design.
too_many_arguments = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# Python sizes and indices cross the FFI boundary as Py_ssize_t; the other casts narrow values kept
# in range where they are made (calendar parts, remainders of a day, FLOAT4). A value read off the
# wire is converted with `try_from`.
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# PyO3 hands `__traverse__` its visitor and extracted `Vec` arguments by value.
needless_pass_by_value = "allow"
struct_excessive_bools = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
# Unwinding stays on: PyO3 turns a Rust panic into a Python exception.
