[[environments]]
name = "all"
databases = ["sqlite", "postgresql", "postgresql+asyncpg", "clickhouse+clickhouse-connect", "clickhouse+clickhouse-driver"]
whole_suite = true
database_independent = false
all_extras = true

# The platforms of a release's wheels (.github/workflows/platform-wheels.yml): the runner each is
# built on, maturin's target and manylinux policy on Linux, and how its wheels are checked - `native`
# installs them on the runner, `alpine` in the python:3.X-alpine images.
[[wheel_platforms]]
platform = "manylinux-x86_64"
runner = "ubuntu-24.04"
target = "x86_64"
manylinux = "2014"
check = "native"

[[wheel_platforms]]
platform = "manylinux-aarch64"
runner = "ubuntu-24.04-arm"
target = "aarch64"
manylinux = "2014"
check = "native"

[[wheel_platforms]]
platform = "musllinux-x86_64"
runner = "ubuntu-24.04"
target = "x86_64"
manylinux = "musllinux_1_2"
check = "alpine"

[[wheel_platforms]]
platform = "musllinux-aarch64"
runner = "ubuntu-24.04-arm"
target = "aarch64"
manylinux = "musllinux_1_2"
check = "alpine"

[[wheel_platforms]]
platform = "macos-x86_64"
runner = "macos-15-intel"
check = "native"

[[wheel_platforms]]
platform = "macos-arm64"
runner = "macos-15"
check = "native"

[[wheel_platforms]]
platform = "windows-x86_64"
runner = "windows-2025"
check = "native"

[[wheel_platforms]]
platform = "windows-arm64"
runner = "windows-11-arm"
check = "native"

[ci.test-sqlite]
axes = { "python" = "versions.python" }

[ci.test-database-independent]
axes = { "python" = "versions.python" }

[ci.test-postgres]
axes = { "postgres" = "versions.postgres", "python" = "versions.python" }

[ci.test-lowest-dependencies]
axes = { "python" = "versions.python" }

[ci.test-brokers]
axes = { "python" = "versions.python" }

[ci.test-clickhouse]
axes = { "clickhouse" = "versions.clickhouse" }
drivers = "urls.clickhouse"
matrix = { "include" = [ { "clickhouse" = "25.8", "python" = "3.12", "driver" = "clickhouse-connect" }, { "clickhouse" = "25.8", "python" = "3.12", "driver" = "clickhouse-driver" }, { "clickhouse" = "25.8", "python" = "3.13", "driver" = "clickhouse-connect" }, { "clickhouse" = "25.8", "python" = "3.13", "driver" = "clickhouse-driver" } ] }

[ci.test-pgbouncer]
axes = { "pgbouncer" = "versions.pgbouncer" }
newest_axes = { "postgres" = "versions.postgres", "python" = "versions.python" }
matrix = { "include" = [ { "pgbouncer" = "1.26", "postgres" = "14", "python" = "3.14" } ] }

[ci.test-poetry-add]
axes = { "python" = "versions.python" }

# The wheels built and installed on one runner of each OS - release.yml builds every platform.
[ci.platform-wheels]
platforms = ["manylinux-x86_64", "macos-arm64", "windows-x86_64"]

[ci_gate]
jobs = [ "catalog", "check", "build-native-linux", "test-sqlite", "test-database-independent", "test-postgres", "test-lowest-dependencies", "test-brokers", "test-clickhouse", "test-pgbouncer", "test-poetry-add", "platform-wheels" ]
