# Shared versions, sources and environments for local runs and CI.

[tools]
poetry = "2.1.4"
poetry_export = "1.9.0"
uv = "0.12.7"

[versions]
"python" = ["3.12", "3.13", "3.14", "3.15"]
"postgres" = ["14", "15", "16", "17", "18"]
"pgbouncer" = ["1.22", "1.23", "1.24", "1.25", "1.26"]
"clickhouse" = ["25.8", "25.10", "25.12", "26.3", "26.7", "26.8", "26.9"]
"redis" = ["7.2", "8.10"]
"rabbitmq" = ["4.0", "4.3"]
"kafka" = ["3.9", "4.3"]

[images.pgbouncer]
"1.22" = "edoburu/pgbouncer:1.22.1-p0@sha256:7f39cf2f872c8d9a0bb0e6a5440c3bf5814036eccf284102870ab08e2603a2c7"
"1.23" = "edoburu/pgbouncer:v1.23.1-p3@sha256:377dec3c0e4a66a1077ec043e16a26ed5702a6d954011a7983a1457c2e070b1d"
"1.24" = "edoburu/pgbouncer:v1.24.1-p1@sha256:3db3d7223e93af52b4116f642951a1a5fa44702a88c2a59cf7562cac19320c9e"
"1.25" = "edoburu/pgbouncer:v1.25.2-p0@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340"
"1.26" = "edoburu/pgbouncer:v1.26.1-p0@sha256:488422e38cff912895d0d65d8963fcd306e6ac589a724398b6eb8e294e94d624"

[images.kafka]
"3.9" = "apache/kafka:3.9.2"
"4.3" = "apache/kafka:4.3.1"

[unsupported_extras]
"3.15" = ["robyn", "clickhouse-driver"]

[database_driver_extras]
"sqlite" = []
"postgresql" = []
"postgresql+asyncpg" = ["asyncpg"]
"clickhouse+clickhouse-connect" = ["clickhouse-connect", "clickhouse-keeper"]
"clickhouse+clickhouse-driver" = ["clickhouse-driver", "clickhouse-keeper"]

[databases_by_driver]
"rust_pg" = "postgresql"
"asyncpg" = "postgresql+asyncpg"
"clickhouse-connect" = "clickhouse+clickhouse-connect"
"clickhouse-driver" = "clickhouse+clickhouse-driver"

[urls.postgres]
"asyncpg" = "postgresql+asyncpg://postgres:postgres@127.0.0.1:{port}/test_{{}}"
"rust_pg" = "postgresql://postgres:postgres@127.0.0.1:{port}/test_{{}}"

[urls.clickhouse]
"clickhouse-connect" = "clickhouse+clickhouse-connect://default:clickhouse@127.0.0.1:{port}/{database}"
"clickhouse-driver" = "clickhouse+clickhouse-driver://default:clickhouse@127.0.0.1:{port}/{database}"

[url_queries]
"pgbouncer" = "?transaction_pooling=true&direct_host=127.0.0.1&direct_port={direct_port}"
"clickhouse" = "?keeper_hosts={keeper_hosts}"
"clickhouse_cluster" = "?cluster=hare_sharded"

[paths]
"clickhouse" = ["tests/dialects/clickhouse", "tests/contracts", "tests/fields/value_types/test_ordered_values.py", "tests/fields/value_types/test_ip_address_text_lookups.py", "tests/fields/value_types/test_ip_address_zones.py"]
"clickhouse_cluster" = ["tests/dialects/clickhouse/cluster"]
"sqlite_regexp" = ["tests/queries/filtering/test_posix_regex_filter.py", "tests/backends/test_sqlite_client.py"]

[pytest]
"options" = ["-q", "-p", "no:cacheprovider", "--tb=short", "--verify-plans"]

[brokers.redis]
"variable" = "HARE_TEST_REDIS_URL"
"url" = "redis://127.0.0.1:{port}/0"
"port_prefix" = 16

[brokers.rabbitmq]
"variable" = "HARE_TEST_RABBITMQ_URL"
"url" = "amqp://guest:guest@127.0.0.1:{port}/"
"port_prefix" = 15

[brokers.kafka]
"variable" = "HARE_TEST_KAFKA_BOOTSTRAP"
"url" = "127.0.0.1:{port}"
"port_prefix" = 19

[sqlite_releases."3.35.5"]
"amalgamation" = "2021/sqlite-amalgamation-3350500.zip"

[sqlite_releases."3.37.2"]
"amalgamation" = "2022/sqlite-amalgamation-3370200.zip"

[sqlite_releases."3.38.0"]
"amalgamation" = "2022/sqlite-amalgamation-3380000.zip"

[sqlite_releases."3.41.0"]
"amalgamation" = "2023/sqlite-amalgamation-3410000.zip"

[sqlite_releases."3.53.4"]
"amalgamation" = "2026/sqlite-amalgamation-3530400.zip"

