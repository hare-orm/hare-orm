name = "tzlocal"
extras = ["tzlocal"]

[[environments]]
name = "yaml"
extras = ["yaml"]

[[environments]]
name = "faker"
extras = ["faker"]

[[environments]]
name = "pytz"
groups = ["pytz"]

[[environments]]
name = "opentelemetry"
extras = ["opentelemetry"]

[[environments]]
name = "pydantic"
