site_name: hare-orm
site_description: Async Python ORM for PostgreSQL and SQLite with pluggable dialects and a Rust PostgreSQL driver.
site_url: https://hare-orm.github.io/hare-orm/
repo_url: https://github.com/hare-orm/hare-orm
repo_name: hare-orm

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo-light.png
  favicon: assets/logo-dark.png
  font:
    text: Public Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - content.code.copy
    - content.tabs.link

extra_css:
  - assets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ru
          name: Русский
          build: true
          site_description: Асинхронная ORM для Python с PostgreSQL и SQLite, подключаемыми диалектами и драйвером PostgreSQL на Rust.
          nav_translations:
            Home: Главная
            Getting started: Начало работы
            Installation: Установка
            Your first model: Первая модель
            Using hare-orm: Работа с hare-orm
            Models: Модели
            Field types: Типы полей
            Encrypted and sensitive fields: Зашифрованные и чувствительные поля
            Relations: Связи
            Meta options: Опции Meta
            Indexes: Индексы
            Constraints and triggers: Ограничения и триггеры
            Validators: Проверки значений
            Model methods: Методы модели
            Models registered at runtime: "Модели, зарегистрированные во время работы"
            Querying: Запросы
            Managers and querysets: Менеджеры и QuerySet
            QuerySet methods: Методы QuerySet
            Filters and lookups: Фильтры и операторы фильтра
            "values() and values_list()": "values() и values_list()"
            Expressions: Выражения
            Database functions: Функции базы данных
            "Aggregates, grouping and window functions": "Агрегаты, группировка и оконные функции"
            Raw SQL: Сырой SQL
            Describing filters and orderings: Описание фильтров и сортировок
            Query plan cache: Кэш планов запросов
            Migrations: Миграции
            The hare command: Команда hare
            Making and applying migrations: Создание и применение миграций
            Operations: Операции
            Zero-downtime migrations: Миграции без остановки приложения
            Migrations without files: Миграции без файлов
            Models from an existing database: Модели по существующей базе
            Detecting drift: Поиск расхождений
            Connections and transactions: Подключения и транзакции
            "Configuration and Hare.init()": "Настройка и Hare.init()"
            Connections: Подключения
            Transactions: Транзакции
            Distributed transactions: Распределённые транзакции
            Several databases: Несколько баз данных
            "Soft delete, versions and tenants": "Мягкое удаление, версии и арендаторы"
            Soft delete: Мягкое удаление
            Versioned models: Версии записей
            Multi-tenancy: Разделение данных по арендаторам
            Observability: Наблюдение
            Observers: Наблюдатели
            SQL comment tags: Метки в комментариях SQL
            N+1 query detection: Поиск повторяющихся запросов (N+1)
            OpenTelemetry: OpenTelemetry
            Testing: Тестирование
            Exceptions: Исключения
            Databases: Базы данных
            Dialects and features: Диалекты и их возможности
            PostgreSQL: PostgreSQL
            Fields: Поля
            Functions: Функции
            Text search: Поиск по тексту
            Vector search: Поиск по векторам
            LISTEN/NOTIFY: LISTEN/NOTIFY
            Integrations: Интеграции
            Pydantic: Pydantic
            Request queries: Запросы из параметров HTTP-запроса
            Web frameworks: Веб-фреймворки
            Litestar: Litestar
            FastAPI: FastAPI
            Robyn: Robyn
            Transactional outbox: Очередь исходящих событий
            Extending hare-orm: Расширение hare-orm
            Custom fields: Свои поля
            Custom lookups: Свои операторы фильтра
            Custom functions and expressions: Свои функции и выражения
            Writing a dialect: Как написать диалект
            Benchmarks: Производительность

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Your first model: getting-started/first-model.md
  - Using hare-orm:
      - Models:
          - Field types: models/field-types.md
          - Encrypted and sensitive fields: models/encrypted-and-sensitive-fields.md
          - Relations: models/relations.md
          - Meta options: models/meta-options.md
          - Indexes: models/indexes.md
          - Constraints and triggers: models/constraints-and-triggers.md
          - Validators: models/validators.md
          - Model methods: models/model-methods.md
          - Models registered at runtime: models/runtime-models.md
      - Querying:
          - Managers and querysets: querying/managers.md
          - QuerySet methods: querying/queryset-methods.md
          - Filters and lookups: querying/filters.md
          - "values() and values_list()": querying/values.md
          - Expressions: querying/expressions.md
          - Database functions: querying/functions.md
          - "Aggregates, grouping and window functions": querying/aggregation.md
          - Raw SQL: querying/raw-sql.md
          - Describing filters and orderings: querying/describing-filters.md
          - Query plan cache: querying/query-plan-cache.md
      - Migrations:
          - The hare command: migrations/cli.md
          - Making and applying migrations: migrations/migrations.md
          - Operations: migrations/operations.md
          - Zero-downtime migrations: migrations/zero-downtime.md
          - Migrations without files: migrations/migrations-without-files.md
          - Models from an existing database: migrations/inspectdb.md
          - Detecting drift: migrations/drift.md
      - Connections and transactions:
          - "Configuration and Hare.init()": connections/configuration.md
          - Connections: connections/connections.md
          - Transactions: connections/transactions.md
          - Distributed transactions: connections/distributed-transactions.md
          - Several databases: connections/multiple-databases.md
      - "Soft delete, versions and tenants":
          - Soft delete: soft-delete-versions-tenants/soft-delete.md
          - Versioned models: soft-delete-versions-tenants/versioned-models.md
          - Multi-tenancy: soft-delete-versions-tenants/multi-tenancy.md
      - Observability:
          - Observers: observability/observers.md
          - SQL comment tags: observability/query-tags.md
          - N+1 query detection: observability/repeated-queries.md
          - OpenTelemetry: observability/opentelemetry.md
      - Testing: testing.md
      - Exceptions: exceptions.md
  - Databases:
      - Dialects and features: dialects/dialects-and-features.md
      - PostgreSQL:
          - Fields: dialects/postgresql/fields.md
          - Functions: dialects/postgresql/functions.md
          - Text search: dialects/postgresql/text-search.md
          - Vector search: dialects/postgresql/vector-search.md
          - LISTEN/NOTIFY: dialects/postgresql/listen-notify.md
  - Integrations:
      - Pydantic: integrations/pydantic.md
      - Request queries: integrations/request-queries.md
      - Web frameworks:
          - Litestar: integrations/litestar.md
          - FastAPI: integrations/fastapi.md
          - Robyn: integrations/robyn.md
      - Transactional outbox: integrations/outbox.md
  - Extending hare-orm:
      - Custom fields: extending/custom-fields.md
      - Custom lookups: extending/custom-lookups.md
      - Custom functions and expressions: extending/custom-functions-and-expressions.md
      - Writing a dialect: extending/writing-a-dialect.md
  - Benchmarks: benchmarks.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
