site_name: hare-orm
site_description: Async Python ORM for PostgreSQL, SQLite and ClickHouse with pluggable dialects and a Rust PostgreSQL driver.
site_url: https://hare-orm.github.io/hare-orm/
repo_url: https://github.com/hare-orm/hare-orm
repo_name: hare-orm

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo-light.png
  favicon: assets/logo-dark.png
  font:
    text: Public Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - content.code.copy
    - content.tabs.link

extra_css:
  - assets/extra.css

hooks:
  - mkdocs_hooks/callout_titles.py
  - mkdocs_hooks/heading_anchors.py

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ru
          name: Русский
          build: true
          site_description: Асинхронная ORM для Python с PostgreSQL, SQLite и ClickHouse, подключаемыми диалектами и драйвером PostgreSQL на Rust.
          nav_translations:
            Home: Главная
            Getting started: Начало работы
            Installation: Установка
            Your first model: Первая модель
            Using hare-orm: Работа с hare-orm
            Models: Модели
            Field types: Типы полей
            Encrypted and sensitive fields: Зашифрованные и чувствительные поля
            Relations: Связи
            Meta options: Опции Meta
            Indexes: Индексы
            Constraints and triggers: Ограничения и триггеры
            "Views, functions, sequences and access": "Представления, функции, последовательности и доступ"
            Validators: Проверки значений
            Model methods: Методы модели
            Models registered at runtime: "Модели, зарегистрированные во время работы"
            Querying: Запросы
            Managers and querysets: Менеджеры и QuerySet
            QuerySet methods: Методы QuerySet
            Filters and lookups: Фильтры и операторы фильтра
            "values() and values_list()": "values() и values_list()"
            Expressions: Выражения
            Database functions: Функции базы данных
            "Aggregates, grouping and window functions": "Агрегаты, группировка и оконные функции"
            Raw SQL: Сырой SQL
            Describing filters and orderings: Описание фильтров и сортировок
            Query plan cache: Кэш планов запросов
            Type checking queries: Проверка типов запросов
            Migrations: Миграции
            The hare command: Команда hare
            Making and applying migrations: Создание и применение миграций
            Operations: Операции
            Zero-downtime migrations: Миграции без остановки приложения
            Migrations without files: Миграции без файлов
            Models from an existing database: Модели по существующей базе
            Detecting drift: Поиск расхождений
            Connections and transactions: Подключения и транзакции
            "Configuration and Hare.init()": "Настройка и Hare.init()"
            Connections: Подключения
            Transactions: Транзакции
            Distributed transactions: Распределённые транзакции
            Several databases: Несколько баз данных
            Connection poolers: Пулеры соединений
            "Soft delete, versions and tenants": "Мягкое удаление, версии и арендаторы"
            Soft delete: Мягкое удаление
            Versioned models: Версии записей
            Multi-tenancy: Разделение данных по арендаторам
            Schema per tenant: Схема на арендатора
            Observability: Наблюдение
            Observers: Наблюдатели
            SQL comment tags: Метки в комментариях SQL
            N+1 query detection: Поиск повторяющихся запросов (N+1)
            OpenTelemetry: OpenTelemetry
            Pool metrics and health: Метрики пула и здоровье
            Testing: Тестирование
            Test setup: Настройка тестов
            Isolation and cleanup: Изоляция и очистка
            Factories: Фабрики
            Query and value assertions: Проверки запросов и значений
            Errors: Ошибки
            Exceptions: Исключения
            Migration errors: Ошибки миграций
            Databases: Базы данных
