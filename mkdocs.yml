            Benchmarks: Производительность
            Summary: Сводка
            SQLite: SQLite

markdown_extensions:
  - attr_list
  - admonition
  # A GitHub alert (> [!WARNING]) renders as an admonition - the pages read the same on GitHub.
  - github-callouts
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

