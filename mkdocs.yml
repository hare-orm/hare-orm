            Schema objects: Объекты схемы
            Transactions and locks: Транзакции и блокировки
            Fields: Поля
            Functions: Функции
            Trigram similarity and unaccent: Сходство по триграммам и unaccent
            Full-text search: Полнотекстовый поиск
            Vector search: Поиск по векторам
            LISTEN/NOTIFY: LISTEN/NOTIFY
            Integrations: Интеграции
            Pydantic: Pydantic
