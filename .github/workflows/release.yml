name: release
on:
  push:
    tags:
      - 'v*.*.*'
  # Builds and checks every wheel without publishing anything - to try the release build before
  # tagging.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python-versions: ${{ steps.catalog.outputs.python-versions }}
      newest-python: ${{ steps.catalog.outputs.newest-python }}
      linux-interpreters: ${{ steps.catalog.outputs.linux-interpreters }}
      wheel-matrix: ${{ steps.catalog.outputs.wheel-matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: catalog
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from tests.matrix.matrix_catalog import MatrixCatalog
          versions = MatrixCatalog.get("versions.python")
          print("python-versions=" + json.dumps(versions))
          print("newest-python=" + versions[-1])
          print("linux-interpreters=" + " ".join("python" + version for version in versions))
          print("wheel-matrix=" + json.dumps({"include": MatrixCatalog.get("wheel_platforms")}))
          PY

  # Checks the tag against the project's release rules (CONTRIBUTING.md, Releases) and takes the
  # release notes out of the changelog.
  check-release:
    needs: [catalog]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.catalog.outputs.newest-python }}
      - name: Install poetry
        run: pipx install "poetry==$(python -m tests.matrix.matrix_catalog tools.poetry)"
      - name: The tag matches the package version
        run: |
          package_version=$(poetry version --short)
          if [ "v$package_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $package_version in pyproject.toml."
            exit 1
          fi
      - name: The tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that isn't on main."
            exit 1
          fi
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  # The whole test matrix of ci.yml on the tagged commit - nothing is published unless it passes.
  tests:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # The wheels of every platform of tests/matrix/catalog.toml [[wheel_platforms]] - hare publishes
  # wheels alone: installed from source, it would have no rust.native.
  platform-wheels:
    needs: [catalog]
    uses: ./.github/workflows/platform-wheels.yml
    with:
      matrix: ${{ needs.catalog.outputs.wheel-matrix }}
      python-versions: ${{ needs.catalog.outputs.python-versions }}
      linux-interpreters: ${{ needs.catalog.outputs.linux-interpreters }}
      upload: true

  publish-pypi:
    if: github.event_name == 'push'
    needs: [check-release, tests, platform-wheels]
    runs-on: ubuntu-24.04
    # PyPI trusted publishing: the pypi environment and this workflow are registered as a trusted
    # publisher of the hare-orm project on PyPI, so no API token is stored in the repository.
    environment:
      name: pypi
      url: https://pypi.org/project/hare-orm/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Check the distributions
        run: pipx run twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [publish-pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "hare-orm ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag
