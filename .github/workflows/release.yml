name: release
on:
  push:
    tags:
      - 'v*.*.*'
  # Builds and checks every wheel without publishing anything - to try the release build before
  # tagging.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Checks the tag against the project's release rules (CONTRIBUTING.md, Releases) and takes the
  # release notes out of the changelog.
  check-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install poetry
        run: pipx install poetry==2.1.4
      - name: The tag matches the package version
        run: |
          package_version=$(poetry version --short)
          if [ "v$package_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $package_version in pyproject.toml."
            exit 1
          fi
      - name: The tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that isn't on main."
            exit 1
          fi
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: release-notes
          path: release-notes.md

  # One wheel per platform, built on that platform's own runner: maturin builds the rust.native
  # extension (in a manylinux/musllinux container on Linux), build_wheel.py packs it into
  # hare-orm's wheel with the same tags, and check_wheel.py installs the wheel into a
  # fresh environment and runs hare on SQLite - and on PostgreSQL through the Rust driver where
  # the runner can start a server.
  platform-wheel:
    name: wheel (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: manylinux-x86_64
            runner: ubuntu-24.04
            target: x86_64
            manylinux: '2014'
            check: native
          - platform: manylinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: '2014'
            check: native
          - platform: musllinux-x86_64
            runner: ubuntu-24.04
            target: x86_64
            manylinux: musllinux_1_2
            check: alpine
          - platform: musllinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: musllinux_1_2
            check: alpine
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64
            check: native
          - platform: macos-arm64
            runner: macos-15
            target: aarch64
            check: native
          - platform: windows-x86_64
            runner: windows-2025
            target: x64
            check: native
          - platform: windows-arm64
            runner: windows-11-arm
            target: aarch64
            check: native
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install poetry and wheel
        shell: bash
        run: |
          pipx install poetry==2.1.4
          python -m pip install wheel
      - name: Build the rust.native extension
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --interpreter ${{ runner.os == 'Windows' && 'python' || 'python3.14' }} --manifest-path rust/native/Cargo.toml --out extension-wheels
      - name: Absolute links in the README, for PyPI
        shell: bash
        run: python .github/scripts/absolute_readme_links.py --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
      - name: Build the hare-orm wheel
        shell: bash
        run: python .github/scripts/build_wheel.py --out dist --extension-wheels extension-wheels
      - name: Start a PostgreSQL server for the check
        if: runner.os == 'Linux' && matrix.check == 'native'
        run: |
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_PASSWORD=postgres postgres:17
          for attempt in $(seq 1 30); do
            if docker exec postgres pg_isready -U postgres > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "::error::PostgreSQL didn't start."
          exit 1
      - name: Check the wheel
        if: matrix.check == 'native'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          if [ "$RUNNER_OS" = "Windows" ]; then
            check_python="$RUNNER_TEMP/wheel-check/Scripts/python.exe"
          else
            check_python="$RUNNER_TEMP/wheel-check/bin/python"
          fi
          "$check_python" -m pip install dist/*.whl
          cp .github/scripts/check_wheel.py "$RUNNER_TEMP/"
          postgres_arguments=()
          if [ "$RUNNER_OS" = "Linux" ]; then
            postgres_arguments=(--postgres-url postgresql://postgres:postgres@127.0.0.1:5432/postgres)
          fi
          cd "$RUNNER_TEMP"
          "$check_python" check_wheel.py --platform-wheel "${postgres_arguments[@]}"
      - name: Check the wheel on Alpine
        if: matrix.check == 'alpine'
        run: |
          docker run --rm -v "$PWD/dist:/dist" -v "$PWD/.github/scripts:/scripts" -w /tmp python:3.14-alpine \
            sh -c 'pip install /dist/*.whl && python /scripts/check_wheel.py --platform-wheel'
      - uses: actions/upload-artifact@v5
        with:
          name: dist-wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  # The pure wheel, for a platform no platform wheel is built for (postgresql+asyncpg:// and
  # SQLite work there; postgresql:// says the Rust driver isn't there), and the sdist - neither
  # carries a compiled extension.
  pure-wheel-and-sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install poetry and wheel
        run: |
          pipx install poetry==2.1.4
          python -m pip install wheel
      - name: Absolute links in the README, for PyPI
        run: python .github/scripts/absolute_readme_links.py --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
      - name: Build the pure wheel and the sdist
        run: |
          python .github/scripts/build_wheel.py --out dist
          poetry build --format sdist --output dist
          if tar -tzf dist/*.tar.gz | grep -E '\.(so|pyd)$'; then
            echo "::error::The sdist carries compiled extensions."
            exit 1
          fi
      - name: Check the pure wheel
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install dist/*.whl
          cp .github/scripts/check_wheel.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-check/bin/python" check_wheel.py --pure-wheel
      - uses: actions/upload-artifact@v5
        with:
          name: dist-pure-wheel-and-sdist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    if: github.event_name == 'push'
    needs: [check-release, platform-wheel, pure-wheel-and-sdist]
    runs-on: ubuntu-24.04
    # PyPI trusted publishing: the pypi environment and this workflow are registered as a trusted
    # publisher of the hare-orm project on PyPI, so no API token is stored in the repository.
    environment:
      name: pypi
      url: https://pypi.org/project/hare-orm/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Check the distributions
        run: pipx run twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [publish-pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          name: release-notes
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "hare-orm ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag
