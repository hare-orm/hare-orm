name: docs
# Publishes docs/ to GitHub Pages on every push to main - the documentation of the released code, and
# the branch the github-pages environment deploys from. The pull request it came from built it in
# strict mode (ci.yml's `check`). Needs the repo's Pages source set to "GitHub Actions" (Settings ->
# Pages) once - `make docs`.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy-docs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-poetry
        id: python
        with:
          python-version: '3.14'
      - name: Build docs
        run: make docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
