name: dco
on:
  pull_request:

permissions:
  contents: read

jobs:
  # Every commit of a pull request must carry a Signed-off-by line naming its own author - the
  # contributor's certification of the Developer Certificate of Origin (CONTRIBUTING.md, Sign-off).
  sign-off:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check every commit is signed off by its author
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author_email=$(git show -s --format='%ae' "$commit")
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$commit" | grep -qiF "<$author_email>"; then
              echo "::error::$(git show -s --format='%h %s' "$commit") has no Signed-off-by line for its author <$author_email>."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off each commit with 'git commit -s'. For commits already made:"
            echo "  git rebase --signoff origin/dev && git push --force-with-lease"
            exit 1
          fi
