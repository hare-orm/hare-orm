version: 2
updates:
  # Python dependencies (pyproject.toml, poetry.lock). One grouped pull request a week keeps the
  # lock file moving without a pull request per package.
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  # The native extension: the PostgreSQL driver, the row readers/writers and the field codecs.
  - package-ecosystem: cargo
    directories:
      - /rust/native
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
    ignore:
      # The arrays postgres-protocol reads iterate by fallible-iterator 0.2's trait, which a newer one's
      # doesn't reach - it moves when postgres-protocol does.
      - dependency-name: fallible-iterator
        versions: [">= 0.3"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
